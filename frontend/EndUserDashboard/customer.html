<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFreeze — Track My Order</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="customer.css">
</head>
<body>

  <!-- TOAST -->
  <div class="tst" id="tst"><div class="tdt"></div><span id="tmsg">Done</span></div>

  <!-- NAV -->
  <nav id="nav">
  <a href="track.html" class="nav-logo">
    <img src="images/logo.png" alt="SmartFreeze" class="nav-logo-img">
    <span class="nav-logo-tx">SmartFreeze</span>
  </a>
</nav>

  <!-- ORDER DETAIL SECTION (hidden until lookup) -->
  <section class="detail-section" id="detailSection">

    <div class="detail-container">

      <!-- Header -->
      <div class="detail-header">
        <div>
          <div class="detail-eyebrow">Your Order</div>
          <div class="detail-title" id="dTitle">Order #SF-001</div>
          <div class="detail-sub" id="dSub">Placed on 12 Mar 2026</div>
        </div>
        <div class="detail-header-right">
          <div class="status-pill" id="dStatusPill"></div>
          <a href="index.html" class="leave-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Leave
          </a>
        </div>
      </div>

      <!-- Main grid -->
      <div class="detail-grid">

        <!-- LEFT: tracking timeline + product -->
        <div class="detail-left">

          <!-- Tracking timeline -->
          <div class="card">
            <div class="card-title">Order Progress</div>
            <div class="timeline" id="timeline"></div>
          </div>

          <!-- Product card -->
          <div class="card">
            <div class="card-title">Your Fridge</div>
            <div class="product-row" id="productRow"></div>
          </div>

        </div>

        <!-- RIGHT: order info + contact -->
        <div class="detail-right">

          <!-- Order summary -->
          <div class="card">
            <div class="card-title">Order Details</div>
            <div class="info-list" id="infoList"></div>
          </div>

          <!-- Payment -->
          <div class="card" id="paymentCard">
            <div class="card-title">Payment</div>
            <div class="payment-block" id="paymentBlock"></div>
          </div>

          <!-- Contact SmartFreeze -->
          <div class="card contact-card">
            <div class="card-title">Need Help?</div>
            <p class="contact-desc">Reach out to SmartFreeze directly for any questions about your order.</p>
            <div class="contact-btns">
              <a class="contact-btn contact-wa" href="https://wa.me/27753593473" target="_blank">
                <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                WhatsApp
              </a>
              <a class="contact-btn contact-call" href="tel:0753593473">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.61 19a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 3.09 4.18 2 2 0 0 1 5.07 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L9.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                Call Us
              </a>
              <a class="contact-btn contact-email" href="/cdn-cgi/l/email-protection#95c6f8f4e7e1f3e7f0f0eff0e6f4d5f2f8f4fcf9bbf6faf8">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                Email
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="page-footer">
    <div>© 2026 SmartFreeze SA</div>
    <div>Delivering Cold Across South Africa</div>
  </footer>

<script src="customer.js"></script>
