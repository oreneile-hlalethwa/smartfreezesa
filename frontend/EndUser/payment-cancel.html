<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartFreeze — Payment Cancelled</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smartfreeze.css">
<style>
.pay-result-page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center; }
.pay-result-icon { width:72px; height:72px; border-radius:50%; background:rgba(232,68,90,.1); border:1px solid rgba(232,68,90,.3); display:flex; align-items:center; justify-content:center; margin:0 auto 24px; }
.pay-result-icon svg { width:32px; height:32px; stroke:var(--red); }
.pay-result-title { font-family:'Bebas Neue',sans-serif; font-size:48px; letter-spacing:2px; margin-bottom:12px; }
.pay-result-sub { font-size:14px; color:var(--muted2); line-height:1.7; max-width:420px; margin:0 auto 32px; }
.pay-result-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.btn-retry { background:var(--white); color:var(--black); border:none; border-radius:8px; padding:13px 28px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Instrument Sans',sans-serif; text-decoration:none; }
.btn-shop  { background:none; color:var(--muted2); border:1px solid var(--border); border-radius:8px; padding:13px 28px; font-size:14px; font-weight:500; cursor:pointer; font-family:'Instrument Sans',sans-serif; text-decoration:none; transition:all .2s; }
.btn-shop:hover { color:var(--white); border-color:var(--border2); }
</style>
</head>
<body>
<div class="pay-result-page">
  <div class="pay-result-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
  <div class="pay-result-title">Payment Cancelled</div>
  <div class="pay-result-sub">Your payment was cancelled. Your order has been saved — you can try again or contact us for help.</div>
  <div class="pay-result-btns">
    <a class="btn-retry" href="index.html">Try Again</a>
    <a class="btn-shop" href="https://wa.me/27753593473" target="_blank">Contact Us</a>
  </div>
</div>
</body>
</html>
